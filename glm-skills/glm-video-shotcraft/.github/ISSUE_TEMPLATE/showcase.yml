# Showcase submission form. Field labels serve as anchors for the publishing pipeline
# (.github/scripts/showcase-publish.py splits sections by "### <label>").
name: "🎬 Submit your video / Showcase"
description: Submit a video made with video-shotcraft for the gallery Showcase page.
title: "[Showcase] Your video title"
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting! Once approved by maintainers, your video will be automatically published to the
        [Showcase page](https://vincentwei1021.github.io/video-shotcraft/showcase.html) along with your social handles.

        **Provide your video using one of two methods**: drag and drop MP4 files (≤10MB) directly into "Video file";
        for larger files, enter an "External video URL" (direct download link).
  - type: input
    id: title
    attributes:
      label: Video Title
      description: Title displayed on the Showcase card
      placeholder: "e.g. Acme Dashboard Product Promo"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-line Description
      description: What product/project this video is made for and what it highlights
    validations:
      required: true
  - type: input
    id: cards
    attributes:
      label: Shot Cards Used (optional)
      placeholder: "e.g. spotlight-hero-card, deck-deal-flyin"
  - type: textarea
    id: video_file
    attributes:
      label: Video File (≤10MB drag-and-drop upload)
      description: Drag and drop MP4 here. GitHub will generate an attachment link; for files >10MB, use the external URL field below.
  - type: input
    id: video_url
    attributes:
      label: External Video URL (for larger files)
      description: Direct downloadable video URL (object storage, cloud drive direct link, etc.)
  - type: input
    id: social_x
    attributes:
      label: X Handle (optional)
      description: "@handle or profile link, displayed on your showcase card"
      placeholder: "@yourhandle or https://x.com/yourhandle"
  - type: input
    id: social_youtube
    attributes:
      label: YouTube (optional)
      description: "@handle or channel link, displayed on your showcase card"
      placeholder: "@yourhandle or https://www.youtube.com/@yourhandle"
  - type: input
    id: social_xhs
    attributes:
      label: Xiaohongshu (optional)
      description: Profile link or Xiaohongshu ID
  - type: input
    id: social_dy
    attributes:
      label: Douyin (optional)
      description: Profile link or Douyin ID
  - type: checkboxes
    id: permission
    attributes:
      label: Authorization Confirmation
      options:
        - label: I own the copyright / publishing rights to this video and agree to showcase it publicly on video-shotcraft (delisting requests can be made anytime via issue)
          required: true
