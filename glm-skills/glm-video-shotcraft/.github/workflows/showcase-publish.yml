# Showcase submission publishing: triggered when adding `showcase-approved`
# label to issues tagged with `showcase`. Video is normalized to h264 mp4 and stored in
# showcase-media release; showcase.json on release is updated, then
# workflow_dispatch triggers deploy-pages redeploy — submission media is not stored in git.
#
# Delist/edit: `gh release download showcase-media --pattern showcase.json`
# After edits: `gh release upload showcase-media showcase.json --clobber`, then manually
# trigger deploy-pages via workflow_dispatch.
name: Publish approved showcase submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write   # upload release assets
  issues: write     # comment + close submission issue
  actions: write    # workflow_dispatch triggers deploy-pages

# Serialize processing when multiple submissions approved simultaneously to prevent showcase.json write conflicts
concurrency:
  group: showcase-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.label.name == 'showcase-approved' &&
      contains(github.event.issue.labels.*.name, 'showcase')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Publish submission
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Passed via env to prevent shell injection from issue body
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/showcase-publish.py

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "⚠️ Auto-publishing failed. Maintainers please check [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Common causes: video attachment/URL unreachable, unrecognized video format, or exceeded 300MB limit."
